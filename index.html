<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Innsbruck Private Trails</title>
    
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #191a1a;
        }
        #map {
            height: 100%;
            width: 100%;
        }

        /* Floating Button unten links (+) */
        .btn-add-wrapper {
            position: absolute;
            bottom: 80px;
            left: 20px;
            z-index: 10;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 30px;
            font-weight: 300;
            cursor: pointer;
            border: none;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-add:active {
            transform: scale(0.95);
            background: #219150;
        }
        #file-input {
            display: none;
        }

        /* Floating Button unten links (Standort zentrieren) */
        .btn-location-wrapper {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 10;
        }
        .btn-location {
            background: #222;
            color: #3498db;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-location:active {
            transform: scale(0.95);
            background: #333;
        }
        .btn-location svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* Styling für den Standorts-Punkt mit integrierter Ausrichtungsspitze */
        .user-location-marker {
            position: relative;
            width: 40px;
            height: 40px;
        }
        .user-location-heading {
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 18px solid rgba(52, 152, 219, 1);
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translate(-50%, -100%);
            display: none;
            z-index: 2;
        }
        .user-location-dot {
            width: 14px;
            height: 14px;
            background-color: rgba(52, 152, 219, 1);
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }
        .user-location-pulse {
            width: 40px;
            height: 40px;
            background-color: rgba(52, 152, 219, 0.4);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 2s infinite;
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* Modal-Eingabefenster */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #222;
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #2ecc71;
            font-size: 18px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            box-sizing: border-box;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: inherit;
            font-size: 14px;
        }
        .modal-content textarea {
            height: 70px;
            resize: vertical;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save {
            background: #27ae60;
            color: white;
        }
        .btn-cancel {
            background: #444;
            color: white;
        }

        /* MapLibre Popups */
        .maplibregl-popup-content {
            background: #222;
            color: #fff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: #222; }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #222; }
        .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #222; }
        .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #222; }
        
        .trail-popup {
            min-width: 180px;
        }
        .trail-popup h4 {
            margin: 0 0 6px 0;
            font-size: 16px;
        }
        .trail-popup .desc {
            font-size: 13px;
            color: #ddd;
            background: #333;
            padding: 6px;
            border-radius: 6px;
            margin: 6px 0;
            white-space: pre-wrap;
        }
        .trail-popup p {
            margin: 4px 0;
            font-size: 13px;
            color: #bbb;
        }
        .trail-popup strong {
            color: #fff;
        }
        .btn-delete-single {
            margin-top: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="btn-add-wrapper">
        <label for="file-input" class="btn-add">+</label>
        <input type="file" id="file-input" accept=".gpx">
    </div>

    <div class="btn-location-wrapper">
        <button class="btn-location" onclick="centerToUserLocation()" title="Mein Standort">
            <svg viewBox="0 0 24 24">
                <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
            </svg>
        </button>
    </div>

    <div class="modal-overlay" id="upload-modal">
        <div class="modal-content">
            <h3>Trail Details</h3>
            <label for="trail-name">Name</label>
            <input type="text" id="trail-name" placeholder="z. B. Nordkette Secret Line">
            
            <label for="trail-desc">Beschreibung</label>
            <textarea id="trail-desc" placeholder="z. B. Steil, viele Wurzeln, unten Schlüsselstelle..."></textarea>
            
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="cancelUpload()">Abbrechen</button>
                <button class="btn-modal btn-save" onclick="saveUpload()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://styqdhuqcmukejmzucwa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0eXFkaHVxY211a2VqbXp1Y3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MTU3NDYsImV4cCI6MjEwMzM5MTc0Nn0.gG4WfcBNlhI0hW4woeftFlrmH5JyGJMzEtgy7k5BVkc';
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // HIER DEINE MAPTILER URL UND KEY EINFÜGEN:
        const MAPTILER_KEY = '7LiPrNQYxbEkCspqfc7Q';
        const MAP_STYLE_URL = `https://api.maptiler.com/maps/01a0541e-e459-7ad9-aec6-e4d2401944ef/style.json?key=${MAPTILER_KEY}`;

        const map = new maplibregl.Map({
            container: 'map',
            style: MAP_STYLE_URL,
            center: [11.4041, 47.2692],
            zoom: 13,
            pitchWithRotate: true
        });

        map.addControl(new maplibregl.NavigationControl({
            showCompass: true,
            showZoom: true,
            visualizePitch: false
        }), 'top-right');

        const trailColors = [
            '#ff0055', '#00d2ff', '#ff9900', 
            '#a855f7', '#2ecc71', '#f1c40f', '#ff3333'
        ];

        function getStableTrailColor(id) {
            if (!id) return trailColors[0];
            const num = parseInt(id, 10) || String(id).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return trailColors[num % trailColors.length];
        }

        let loadedTrailIds = [];
        let currentGpxContent = null;
        let userMarker = null;
        let userLngLat = null;
        let currentHeading = null;
        let kompassInitialized = false;
        let highlightedTrailId = null;

        // Marker DOM-Element
        const el = document.createElement('div');
        el.className = 'user-location-marker';
        el.innerHTML = '<div class="user-location-heading" id="user-heading"></div><div class="user-location-pulse"></div><div class="user-location-dot"></div>';

        // Ausrichtung bei Kartenrotation aktualisieren
        map.on('rotate', updateHeadingUI);

        function updateHeadingUI() {
            if (currentHeading === null) return;
            const headingEl = document.getElementById('user-heading');
            if (headingEl) {
                headingEl.style.display = 'block';
                const mapBearing = map.getBearing();
                const adjustedHeading = currentHeading - mapBearing;
                headingEl.style.transform = `translate(-50%, -100%) rotate(${adjustedHeading}deg)`;
            }
        }

        function handleOrientation(e) {
            if (e.webkitCompassHeading) {
                currentHeading = e.webkitCompassHeading;
            } else if (e.alpha !== null) {
                currentHeading = 360 - e.alpha;
            }
            updateHeadingUI();
        }

        function initKompass() {
            if (kompassInitialized) return;

            // Prüfen ob iOS Berechtigung verlangt
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            kompassInitialized = true;
                        }
                    })
                    .catch(console.error);
            } else if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                kompassInitialized = true;
            } else if ('ondeviceorientation' in window) {
                window.addEventListener('deviceorientation', handleOrientation, true);
                kompassInitialized = true;
            }
        }

        // GPS Standort-Tracking
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    userLngLat = [position.coords.longitude, position.coords.latitude];
                    
                    if (!userMarker) {
                        userMarker = new maplibregl.Marker({ element: el }).setLngLat(userLngLat).addTo(map);
                        initKompass(); // Versuche direkten Start (Android/Desktop)
                    } else {
                        userMarker.setLngLat(userLngLat);
                    }

                    // Falls vom GPS ein Bewegungswinkel (Heading) vorliegt, diesen als Fallback nutzen
                    if (position.coords.heading !== null && !isNaN(position.coords.heading)) {
                        currentHeading = position.coords.heading;
                        updateHeadingUI();
                    }
                },
                (error) => {
                    console.error("Standort-Fehler:", error.message);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function centerToUserLocation() {
            // iOS Fallback: Manuelle Freigabe beim Klick
            if (!kompassInitialized) {
                initKompass();
            }

            if (userLngLat) {
                map.flyTo({ center: userLngLat, zoom: 16, speed: 1.2 });
            } else {
                alert("Dein Standort wird noch ermittelt...");
            }
        }

        // GPX-File Handler
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                currentGpxContent = event.target.result; 
                document.getElementById('trail-name').value = file.name.replace('.gpx', '');
                document.getElementById('trail-desc').value = '';
                document.getElementById('upload-modal').style.display = 'flex';
            };
            reader.readAsText(file);
        });

        async function saveUpload() {
            if (!currentGpxContent) {
                alert("Die Datei wurde noch nicht vollständig gelesen!");
                return;
            }

            const name = document.getElementById('trail-name').value.trim() || 'Unbenannter Trail';
            const desc = document.getElementById('trail-desc').value.trim();
            const gpxToSend = currentGpxContent; 

            closeModal();

            const { data, error } = await db
                .from('Trails')
                .insert([{ 
                    name: name, 
                    description: desc, 
                    gpx_data: gpxToSend 
                }])
                .select();

            if (error) {
                alert("Fehler beim Speichern in Supabase: " + error.message);
                return;
            }

            if (data && data.length > 0) {
                addGpxToMap(data[0].gpx_data, data[0].id, data[0].name, data[0].description, true);
            }
        }

        function cancelUpload() { closeModal(); }
        function closeModal() {
            document.getElementById('upload-modal').style.display = 'none';
            document.getElementById('file-input').value = '';
            currentGpxContent = null;
        }

        function calculateTrailStats(geojson) {
            let distMeters = 0;
            let eleGain = 0;
            let eleLoss = 0;

            const coordinates = geojson.features.flatMap(f => {
                if (f.geometry.type === 'LineString') return [f.geometry.coordinates];
                if (f.geometry.type === 'MultiLineString') return f.geometry.coordinates;
                return [];
            });

            coordinates.forEach(line => {
                for (let i = 0; i < line.length - 1; i++) {
                    const p1 = line[i];
                    const p2 = line[i+1];
                    
                    const R = 6371000;
                    const dLat = (p2[1] - p1[1]) * Math.PI / 180;
                    const dLon = (p2[0] - p1[0]) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                              Math.cos(p1[1] * Math.PI / 180) * Math.cos(p2[1] * Math.PI / 180) *
                              Math.sin(dLon/2) * Math.sin(dLon/2);
                    distMeters += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

                    if (p1[2] !== undefined && p2[2] !== undefined) {
                        const diff = p2[2] - p1[2];
                        if (diff > 0) eleGain += diff;
                        else eleLoss += Math.abs(diff);
                    }
                }
            });

            return {
                distKm: (distMeters / 1000).toFixed(2),
                eleGain: Math.round(eleGain),
                eleLoss: Math.round(eleLoss)
            };
        }

        function addGpxToMap(gpxData, dbId, customName, customDesc, zoomTo = false) {
            const domParser = new DOMParser();
            const gpxXml = domParser.parseFromString(gpxData, 'text/xml');
            const geojson = toGeoJSON.gpx(gpxXml);
            
            const color = getStableTrailColor(dbId);
            const sourceId = `trail-source-${dbId}`;
            const layerId = `trail-layer-${dbId}`;

            map.addSource(sourceId, {
                type: 'geojson',
                data: geojson
            });

            map.addLayer({
                id: layerId,
                type: 'line',
                source: sourceId,
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': color,
                    'line-width': 5,
                    'line-opacity': 0.9
                }
            });

            map.on('click', layerId, (e) => {
                // 1. Vorheriges Highlight zurücksetzen
                if (highlightedTrailId && map.getLayer(`trail-layer-${highlightedTrailId}`)) {
                    const prevColor = getStableTrailColor(highlightedTrailId);
                    map.setPaintProperty(`trail-layer-${highlightedTrailId}`, 'line-width', 5);
                    map.setPaintProperty(`trail-layer-${highlightedTrailId}`, 'line-color', prevColor);
                }

                // 2. Aktuellen Trail hervorheben & nach ganz oben holen
                highlightedTrailId = dbId;
                map.moveLayer(layerId); // Schiebt die Ebene visuell über alle anderen Trails
                map.setPaintProperty(layerId, 'line-width', 8); // Breiter machen
                map.setPaintProperty(layerId, 'line-color', '#ffffff'); // Auf Weiß oder Knallfarbe ändern

                // 3. Popup-Inhalt & Erstellung (wie bisher)
                const stats = calculateTrailStats(geojson);
                const name = customName || 'Unbenannter Trail';
                const descHtml = customDesc ? `<div class="desc">${customDesc}</div>` : '';

                const popupHtml = `
                    <div class="trail-popup">
                        <h4 style="color: ${color};">${name}</h4>
                        ${descHtml}
                        <p>Länge: <strong>${stats.distKm} km</strong></p>
                        <button class="btn-delete-single" onclick="deleteSingleTrail(${dbId})">Trail für alle löschen</button>
                    </div>
                `;

                const popup = new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(popupHtml)
                    .addTo(map);

                // Wenn das Popup geschlossen wird, das Highlight wieder aufheben
                popup.on('close', () => {
                    if (map.getLayer(layerId)) {
                        map.setPaintProperty(layerId, 'line-width', 5);
                        map.setPaintProperty(layerId, 'line-color', color);
                    }
                    highlightedTrailId = null;
                });
            });

            map.on('mouseenter', layerId, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', layerId, () => { map.getCanvas().style.cursor = ''; });

            if (zoomTo && geojson.features.length > 0) {
                const bounds = new maplibregl.LngLatBounds();
                geojson.features.forEach(f => {
                    if (f.geometry.type === 'LineString') {
                        f.geometry.coordinates.forEach(coord => bounds.extend([coord[0], coord[1]]));
                    } else if (f.geometry.type === 'MultiLineString') {
                        f.geometry.coordinates.flatMap(c => c).forEach(coord => bounds.extend([coord[0], coord[1]]));
                    }
                });
                if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 40 });
            }

            loadedTrailIds.push(dbId);
        }

        async function deleteSingleTrail(dbId) {
            if (confirm("Diesen Trail wirklich für ALLE Benutzer aus der Cloud löschen?")) {
                const { error } = await db
                    .from('Trails')
                    .delete()
                    .eq('id', dbId);

                if (error) {
                    alert("Fehler beim Löschen: " + error.message);
                    return;
                }

                if (map.getLayer(`trail-layer-${dbId}`)) map.removeLayer(`trail-layer-${dbId}`);
                if (map.getSource(`trail-source-${dbId}`)) map.removeSource(`trail-source-${dbId}`);
                
                const popups = document.getElementsByClassName('maplibregl-popup');
                if (popups[0]) popups[0].remove();

                loadedTrailIds = loadedTrailIds.filter(id => id !== dbId);
            }
        }

        map.on('load', async () => {
            // Optionale 3D-Höhendaten von MapTiler laden
            if (MAPTILER_KEY && MAPTILER_KEY !== '7LiPrNQYxbEkCspqfc7Q') {
                map.addSource('maptiler-terrain', {
                    type: 'raster-dem',
                    url: `https://api.maptiler.com/tiles/terrain-rgb/tiles.json?key=${MAPTILER_KEY}`,
                    tileSize: 512
                });

                map.setTerrain({
                    source: 'maptiler-terrain',
                    exaggeration: 2.0
                });
            }

            // Trails aus Supabase laden
            const { data: trails, error } = await db
                .from('Trails')
                .select('*');

            if (error) {
                console.error("Fehler beim Laden aus Supabase:", error);
                return;
            }

            if (trails) {
                trails.forEach(trail => {
                    addGpxToMap(trail.gpx_data, trail.id, trail.name, trail.description, false);
                });
            }
        });
    </script>
</body>
</html>
