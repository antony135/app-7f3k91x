<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Innsbruck Private Trails</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #191a1a;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        /* Floating Button unten links (+) */
        .btn-add-wrapper {
            position: absolute;
            bottom: 95px;
            left: 20px;
            z-index: 1000;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 30px;
            font-weight: 300;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-add:active {
            transform: scale(0.95);
            background: #219150;
        }
        #file-input {
            display: none;
        }

        /* Floating Button unten rechts (Standort zentrieren) */
        .btn-location-wrapper {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
        }
        .btn-location {
            background: #222;
            color: #3498db;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-location:active {
            transform: scale(0.95);
            background: #333;
        }
        .btn-location svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* Styling für den pulsierenden Standorts-Punkt mit Blickrichtung */
        .user-location-marker {
            position: relative;
        }
        .user-location-heading {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 22px solid rgba(52, 152, 219, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: bottom center;
            margin-left: -10px;
            margin-top: -22px;
            display: none;
            transition: transform 0.1s ease-out;
        }
        .user-location-dot {
            width: 14px;
            height: 14px;
            background-color: #3498db;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .user-location-pulse {
            width: 40px;
            height: 40px;
            background-color: rgba(52, 152, 219, 0.4);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 2s infinite;
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* Modal-Eingabefenster */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #222;
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #2ecc71;
            font-size: 18px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            box-sizing: border-box;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: inherit;
            font-size: 14px;
        }
        .modal-content textarea {
            height: 70px;
            resize: vertical;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save {
            background: #27ae60;
            color: white;
        }
        .btn-cancel {
            background: #444;
            color: white;
        }

        /* Popup-Karten */
        .leaflet-popup-content-wrapper {
            background: #222;
            color: #fff;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .leaflet-popup-tip {
            background: #222;
        }
        .trail-popup {
            padding: 6px 10px;
            min-width: 180px;
        }
        .trail-popup h4 {
            margin: 0 0 6px 0;
            font-size: 16px;
        }
        .trail-popup .desc {
            font-size: 13px;
            color: #ddd;
            background: #333;
            padding: 6px;
            border-radius: 6px;
            margin: 6px 0;
            white-space: pre-wrap;
        }
        .trail-popup p {
            margin: 4px 0;
            font-size: 13px;
            color: #bbb;
        }
        .trail-popup strong {
            color: #fff;
        }
        .btn-delete-single {
            margin-top: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="btn-add-wrapper">
        <label for="file-input" class="btn-add">+</label>
        <input type="file" id="file-input" accept=".gpx">
    </div>

    <div class="btn-location-wrapper">
        <button class="btn-location" onclick="centerToUserLocation()" title="Mein Standort">
            <svg viewBox="0 0 24 24">
                <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
            </svg>
        </button>
    </div>

    <div class="modal-overlay" id="upload-modal">
        <div class="modal-content">
            <h3>Trail Details</h3>
            <label for="trail-name">Name</label>
            <input type="text" id="trail-name" placeholder="z. B. Nordkette Secret Line">
            
            <label for="trail-desc">Beschreibung</label>
            <textarea id="trail-desc" placeholder="z. B. Steil, viele Wurzeln, unten Schlüsselstelle..."></textarea>
            
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="cancelUpload()">Abbrechen</button>
                <button class="btn-modal btn-save" onclick="saveUpload()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Plugin für die Karten-Rotation -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://styqdhuqcmukejmzucwa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInRefiI6InN0eXFkaHVxY211a2VqbXp1Y3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MTU3NDYsImV4cCI6MjEwMzM5MTc0Nn0.gG4WfcBNlhI0hW4woeftFlrmH5JyGJMzEtgy7k5BVkc';
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Karte mit echter Touch-Rotation initialisieren
        const map = L.map('map', { 
            zoomControl: false,
            rotate: true,
            touchRotate: true,
            rotateControl: false
        }).setView([47.2692, 11.4041], 13);

        L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap, CyclOSM'
        }).addTo(map);

        const trailColors = ['#ff0055', '#00d2ff', '#ff9900', '#a855f7', '#2ecc71', '#f1c40f', '#ff3333'];

        function getRandomTrailColor() {
            return trailColors[Math.floor(Math.random() * trailColors.length)];
        }

        let loadedTrails = [];
        let currentGpxContent = null;
        let userMarker = null;
        let userLatLng = null;

        const userIcon = L.divIcon({
            className: 'user-location-marker',
            html: '<div class="user-location-heading" id="user-heading"></div><div class="user-location-pulse"></div><div class="user-location-dot"></div>',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        map.locate({ 
            setView: false, 
            watch: true, 
            enableHighAccuracy: true,
            timeout: 10000 
        });

        map.on('locationfound', function(e) {
            userLatLng = e.latlng;
            if (!userMarker) {
                userMarker = L.marker(userLatLng, { icon: userIcon }).addTo(map);
                initKompass();
            } else {
                userMarker.setLatLng(userLatLng);
            }
        });

        function initKompass() {
            const handleOrientation = (e) => {
                let compassHeading = null;
                if (e.webkitCompassHeading) {
                    compassHeading = e.webkitCompassHeading;
                } else if (e.alpha !== null) {
                    compassHeading = 360 - e.alpha;
                }

                if (compassHeading !== null) {
                    const headingEl = document.getElementById('user-heading');
                    if (headingEl) {
                        headingEl.style.display = 'block';
                        headingEl.style.transform = `rotate(${compassHeading}deg)`;
                    }
                }
            };

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        }
                    })
                    .catch(console.error);
            } else if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function centerToUserLocation() {
            if (userLatLng) {
                map.flyTo(userLatLng, 16, { animate: true, duration: 1 });
            } else {
                alert("Dein Standort wird noch ermittelt...");
            }
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                currentGpxContent = event.target.result; 
                document.getElementById('trail-name').value = file.name.replace('.gpx', '');
                document.getElementById('trail-desc').value = '';
                document.getElementById('upload-modal').style.display = 'flex';
            };
            reader.readAsText(file);
        });

        async function saveUpload() {
            if (!currentGpxContent) return;

            const name = document.getElementById('trail-name').value.trim() || 'Unbenannter Trail';
            const desc = document.getElementById('trail-desc').value.trim();
            const gpxToSend = currentGpxContent; 

            closeModal();

            const { data, error } = await db
                .from('Trails')
                .insert([{ name: name, description: desc, gpx_data: gpxToSend }])
                .select();

            if (error) {
                alert("Fehler beim Speichern: " + error.message);
                return;
            }

            if (data && data.length > 0) {
                addGpxToMap(data[0].gpx_data, data[0].id, data[0].name, data[0].description, true);
            }
        }

        function cancelUpload() { closeModal(); }
        function closeModal() {
            document.getElementById('upload-modal').style.display = 'none';
            document.getElementById('file-input').value = '';
            currentGpxContent = null;
        }

        function addGpxToMap(gpxData, dbId, customName, customDesc, zoomTo = false) {
            const color = getRandomTrailColor();

            const gpxLayer = new L.GPX(gpxData, {
                async: true,
                polyline_options: {
                    color: color,
                    opacity: 0.9,
                    weight: 5,
                    lineCap: 'round'
                },
                marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
            }).on('loaded', function(e) {
                const gpx = e.target;
                if (zoomTo) map.fitBounds(gpx.getBounds());

                const name = customName || gpx.get_name() || 'Unbenannter Trail';
                const distKm = (gpx.get_distance() / 1000).toFixed(2);
                const eleGain = Math.round(gpx.get_elevation_gain());
                const eleLoss = Math.round(gpx.get_elevation_loss());
                const descHtml = customDesc ? `<div class="desc">${customDesc}</div>` : '';

                const popupContent = `
                    <div class="trail-popup">
                        <h4 style="color: ${color};">${name}</h4>
                        ${descHtml}
                        <p>Länge: <strong>${distKm} km</strong></p>
                        <p>Aufstieg: <strong>+${eleGain} m</strong></p>
                        <p>Abstieg: <strong>-${eleLoss} m</strong></p>
                        <button class="btn-delete-single" onclick="deleteSingleTrail(${dbId})">Trail für alle löschen</button>
                    </div>
                `;
                gpx.bindPopup(popupContent);
            }).addTo(map);

            loadedTrails.push({ id: dbId, layer: gpxLayer });
        }

        async function deleteSingleTrail(dbId) {
            if (confirm("Diesen Trail wirklich für ALLE Benutzer löschen?")) {
                const { error } = await db.from('Trails').delete().eq('id', dbId);
                if (error) {
                    alert("Fehler beim Löschen: " + error.message);
                    return;
                }
                const item = loadedTrails.find(t => t.id === dbId);
                if (item) map.removeLayer(item.layer);
                loadedTrails = loadedTrails.filter(t => t.id !== dbId);
            }
        }

        window.onload = async function() {
            const { data: trails, error } = await db.from('Trails').select('*');
            if (trails) {
                trails.forEach(trail => {
                    addGpxToMap(trail.gpx_data, trail.id, trail.name, trail.description, false);
                });
            }
        };
    </script>
</body>
</html>
